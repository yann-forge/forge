# Écrire @claude dans un commentaire de ticket ou de pull request pour lui demander une modification.
name: Claude à la demande
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    if: github.actor == github.repository_owner && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: claude-forge
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*)"
